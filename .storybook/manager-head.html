<style>
  /* The Controls panel renders native radio/checkbox inputs with no Storybook
     styling, so they inherit the host OS form-control rendering. Pin a light
     colour scheme and a brand accent so unselected radios show as a normal
     outline and selected ones use the brand colour. */
  :root {
    color-scheme: light;
  }

  body,
  input[type='radio'],
  input[type='checkbox'] {
    accent-color: #2f1778;
  }

  @font-face {
    font-family: 'Montserrat Alternates';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/Montserrat_Alternates/MontserratAlternates-Regular.ttf') format('truetype');
  }

  @font-face {
    font-family: 'Montserrat Alternates';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/Montserrat_Alternates/MontserratAlternates-Italic.ttf') format('truetype');
  }

  @font-face {
    font-family: 'Montserrat Alternates';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/Montserrat_Alternates/MontserratAlternates-SemiBold.ttf') format('truetype');
  }

  @font-face {
    font-family: 'Montserrat Alternates';
    font-style: italic;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/Montserrat_Alternates/MontserratAlternates-SemiBoldItalic.ttf') format('truetype');
  }

  @font-face {
    font-family: 'Montserrat Alternates';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/Montserrat_Alternates/MontserratAlternates-Bold.ttf') format('truetype');
  }

  @font-face {
    font-family: 'Montserrat Alternates';
    font-style: italic;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/Montserrat_Alternates/MontserratAlternates-BoldItalic.ttf') format('truetype');
  }
</style>
