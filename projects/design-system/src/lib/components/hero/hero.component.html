<!--
  Semantic hero region. `aria-labelledby` ties the section to its own heading
  so assistive tech announces it as a labeled landmark region.
-->
<section
  class="ds-hero__region d-flex flex-column justify-content-center py-16 px-4 px-md-8"
  [class.ds-hero--primary]="variant() === 'primary'"
  [class.ds-hero--dark]="variant() === 'dark'"
  [class.ds-hero--light]="variant() === 'light'"
  [class.ds-hero--image]="variant() === 'image'"
  aria-labelledby="ds-hero-heading"
>
  @if (variant() === 'image' && backgroundImage(); as imageUrl) {
    <img class="ds-hero__background" [src]="imageUrl" alt="" aria-hidden="true" />
  }

  <div class="ds-hero__content mx-auto text-center">
    <h1 id="ds-hero-heading" class="ds-hero__heading mb-4">{{ heading() }}</h1>

    @if (subheading()) {
      <p class="ds-hero__subheading lead mb-6">{{ subheading() }}</p>
    }

    <div class="ds-hero__actions d-flex flex-wrap justify-content-center gap-3">
      <ng-content select="[dsHeroCta]" />
    </div>
  </div>
</section>
