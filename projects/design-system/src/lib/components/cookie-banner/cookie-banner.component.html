@if (open()) {
  <div
    class="ds-cookie-banner__region d-flex flex-column md:flex-row md:align-items-center gap-4 p-6"
    role="dialog"
    aria-modal="false"
    [attr.aria-labelledby]="messageId"
  >
    <p [id]="messageId" class="ds-cookie-banner__message mb-0 flex-grow-1">
      <ng-content>{{ message() }}</ng-content>
    </p>

    <div class="ds-cookie-banner__actions d-flex flex-wrap gap-2 flex-shrink-0">
      @if (manageLabel(); as label) {
        <!-- Outline buttons resolve their theme tokens in dark mode, which keeps them
             light on the always-dark banner. -->
        <button
          type="button"
          class="btn btn-outline theme-inverse ds-focus-ring"
          data-bs-theme="dark"
          (click)="requestManage()"
        >
          {{ label }}
        </button>
      }
      <button
        type="button"
        class="btn ds-focus-ring"
        [class.btn-outline]="!equalProminence()"
        [class.theme-inverse]="!equalProminence()"
        [attr.data-bs-theme]="equalProminence() ? null : 'dark'"
        [class.btn-solid]="equalProminence()"
        [class.theme-primary]="equalProminence()"
        (click)="decline()"
      >
        {{ declineLabel() }}
      </button>
      <button
        #acceptButton
        type="button"
        class="btn btn-solid theme-primary ds-focus-ring"
        (click)="accept()"
      >
        {{ acceptLabel() }}
      </button>
    </div>
  </div>
}
