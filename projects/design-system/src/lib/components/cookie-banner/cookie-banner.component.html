@if (open()) {
  <div
    class="ds-cookie-banner__region d-flex flex-column flex-md-row align-items-md-center gap-4 p-6"
    role="dialog"
    aria-modal="false"
    aria-labelledby="ds-cookie-banner-message"
  >
    <p id="ds-cookie-banner-message" class="ds-cookie-banner__message mb-0 flex-grow-1">
      <ng-content>{{ message() }}</ng-content>
    </p>

    <div class="ds-cookie-banner__actions d-flex flex-wrap gap-2 flex-shrink-0">
      @if (manageLabel(); as label) {
        <button
          type="button"
          class="btn btn-outline-light ds-focus-ring"
          (click)="requestManage()"
        >
          {{ label }}
        </button>
      }
      <button
        type="button"
        class="btn ds-focus-ring"
        [class.btn-outline-light]="!equalProminence()"
        [class.btn-primary]="equalProminence()"
        (click)="decline()"
      >
        {{ declineLabel() }}
      </button>
      <button
        #acceptButton
        type="button"
        class="btn btn-primary ds-focus-ring"
        (click)="accept()"
      >
        {{ acceptLabel() }}
      </button>
    </div>
  </div>
}
