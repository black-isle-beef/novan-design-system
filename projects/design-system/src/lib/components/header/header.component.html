<header class="ds-header__banner d-flex align-items-center" [class.border-bottom]="!app()" role="banner">
  <a class="ds-skip-link" href="#ds-main-content">Skip to main content</a>

  <div class="ds-header__brand" [class.px-4]="!app()" [class.py-2]="!app()">
    <ng-content select="[dsBrand]" />
  </div>

  <div class="ds-header__nav flex-grow-1">
    <ds-main-nav [items]="navItems()" [variant]="app() ? 'pills' : 'default'" />
  </div>

  <div class="ds-header__actions d-flex align-items-center gap-2" [class.px-4]="!app()" [class.py-2]="!app()">
    <ng-content select="[dsActions]" />
  </div>
</header>
