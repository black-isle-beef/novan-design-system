<button
  class="btn"
  [class.btn-primary]="variant() === 'primary'"
  [class.btn-secondary]="variant() === 'secondary'"
  [class.btn-success]="variant() === 'success'"
  [class.btn-warning]="variant() === 'warning'"
  [class.btn-danger]="variant() === 'danger'"
  [class.btn-info]="variant() === 'info'"
  [class.btn-hero-light]="variant() === 'hero-light'"
  [class.btn-hero-dark]="variant() === 'hero-dark'"
  [class.btn-sm]="size() === 'sm'"
  [class.btn-lg]="size() === 'lg'"
  type="button"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading()"
  (click)="handleClick()"
>
  @if (loading()) {
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    <span class="visually-hidden" aria-live="polite">Loading</span>
  }
  <ng-content select="[dsButtonIcon]"></ng-content>
  <span><ng-content></ng-content></span>
</button>
