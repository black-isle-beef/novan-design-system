<button
  class="btn"
  [class]="variantClass()"
  [class.btn-sm]="size() === 'sm'"
  [class.btn-lg]="size() === 'lg'"
  type="button"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading()"
  (click)="handleClick()"
>
  @if (loading()) {
    <span class="spinner-border spinner-sm" aria-hidden="true"></span>
  }
  <ng-content select="[dsButtonIcon]"></ng-content>
  <span><ng-content></ng-content></span>
</button>
<!-- Always rendered, and outside the aria-busy button: a live region only announces changes to content it already contains. -->
<span class="visually-hidden" aria-live="polite">@if (loading()) {Loading}</span>
