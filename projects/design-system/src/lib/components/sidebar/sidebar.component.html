<nav class="ds-sidebar__nav" [attr.aria-label]="ariaLabel()">
  <ul id="ds-sidebar-list" class="ds-sidebar__list list-unstyled d-flex flex-column gap-1">
    @for (item of items(); track item.label) {
      <li>
        <a
          class="ds-sidebar__link ds-focus-ring"
          [href]="isExternalLink(item.href) ? item.href : null"
          [routerLink]="isExternalLink(item.href) ? null : item.href"
          [attr.aria-current]="item.active ? 'page' : null"
          [class.ds-sidebar__link--active]="item.active"
        >
          @if (item.icon) {
            <i class="ds-sidebar__icon" [class]="item.icon" aria-hidden="true"></i>
          }
          <span class="ds-sidebar__label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <button
    type="button"
    class="ds-sidebar__toggle ds-focus-ring"
    [attr.aria-expanded]="!collapsed()"
    aria-controls="ds-sidebar-list"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="toggleCollapsed()"
  >
    <i class="ds-sidebar__toggle-icon bi bi-chevron-right" aria-hidden="true"></i>
  </button>
</nav>
