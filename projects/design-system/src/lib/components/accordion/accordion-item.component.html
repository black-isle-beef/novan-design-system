<details
  #details
  class="accordion-item"
  [attr.name]="accordion?.groupName"
  [open]="open()"
  (toggle)="handleToggle($event)"
>
  <summary class="accordion-header" [id]="headingId">
    <span>
      <ng-content select="[dsAccordionItemSummary]">{{ summary() }}</ng-content>
    </span>
    <i class="accordion-icon bi bi-chevron-down" aria-hidden="true"></i>
  </summary>
  <div class="accordion-body">
    <ng-content></ng-content>
  </div>
</details>
