<ds-header [navItems]="navItems">
  <a dsBrand href="#" class="fw-bold fs-4 text-decoration-none">Novan</a>

  <div dsActions>
    <button
      type="button"
      class="ds-sandbox__theme-toggle btn btn-outline-secondary ds-focus-ring d-inline-flex align-items-center gap-2"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()"
    >
      <i class="bi" [class.bi-moon-stars-fill]="theme() === 'light'" [class.bi-sun-fill]="theme() === 'dark'" aria-hidden="true"></i>
      <span class="ds-sandbox__theme-toggle-label">{{ theme() === 'dark' ? 'Light mode' : 'Dark mode' }}</span>
    </button>
  </div>
</ds-header>

<div class="ds-sandbox__breadcrumb-bar border-bottom px-4 px-md-8 py-3">
  <ds-breadcrumb [items]="breadcrumbItems" />
</div>

<main id="ds-main-content" class="ds-sandbox__main">
  <section id="overview" aria-labelledby="ds-hero-heading">
    <ds-hero
      heading="Component sandbox"
      subheading="Every structural piece of the Novan design system, composed on one page and served from localhost."
      variant="primary"
    >
      <a dsHeroCta class="btn btn-hero-light" href="#buttons">Jump to buttons</a>
      <a dsHeroCta class="btn btn-hero-light" href="#forms">Jump to forms</a>
    </ds-hero>
  </section>

  <section id="buttons" class="p-4 p-md-8 border-bottom" aria-labelledby="ds-sandbox-buttons-heading">
    <h2 id="ds-sandbox-buttons-heading" class="h3 mb-4">Buttons</h2>
    <div class="d-flex flex-wrap gap-3">
      <ds-button variant="primary">Primary</ds-button>
      <ds-button variant="secondary">Secondary</ds-button>
      <ds-button variant="success">Success</ds-button>
      <ds-button variant="warning">Warning</ds-button>
      <ds-button variant="danger">Danger</ds-button>
      <ds-button variant="info">Info</ds-button>
    </div>
  </section>

  <section id="content" class="p-4 p-md-8 border-bottom" aria-labelledby="ds-sandbox-content-heading">
    <h2 id="ds-sandbox-content-heading" class="h3 mb-4">Content banner</h2>
    <ds-image-banner [imageSrc]="placeholderImage" imageAlt="" heading="Split layout content banner">
      <p class="mb-0">
        Paired imagery and copy from <code>ds-image-banner</code>, following the same light/dark
        and breakpoint rules as the rest of the page.
      </p>
    </ds-image-banner>
  </section>

  <section id="forms" class="p-4 p-md-8" aria-labelledby="ds-sandbox-forms-heading">
    <h2 id="ds-sandbox-forms-heading" class="visually-hidden">Forms</h2>
    <ds-forms />
  </section>
</main>

<ds-footer organizationName="Novan Inc." [linkGroups]="footerLinkGroups">
  <span dsFooterLegal>Internal component sandbox — not for production content.</span>
</ds-footer>

<ds-cookie-banner />
